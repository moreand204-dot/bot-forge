plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lordescanor.botforge'
    compileSdk 33
    defaultConfig {
        applicationId 'com.lordescanor.botforge'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    resolutionStrategy.force 'androidx.savedstate:savedstate:1.0.0'
}

dependencies {
    implementation 'com.google.android.material:material:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.activity:activity:1.2.4'
    implementation 'androidx.fragment:fragment:1.2.5'
    implementation 'androidx.savedstate:savedstate:1.0.0'
}
